# ── Bluetooth Central + GATT Client ─────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_SMP=n
CONFIG_BT_MAX_CONN=1

# MTU must match STM32 TARGET_MTU (247 bytes)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# Accept STM32-initiated PHY and connection parameter updates
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y

# GATT client buffers
CONFIG_BT_ATT_TX_COUNT=5

# ── USB CDC ACM (old device stack — works on NCS 2.x and NCS 3.x compat) ────
# If this fails to compile on NCS 3.x, switch to:
#   CONFIG_USB_DEVICE_STACK_NEXT=y
#   CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Vega Bridge"
CONFIG_USB_DEVICE_MANUFACTURER="OpenIC"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x52BD
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

# ── Console: goes to UART0 / J-Link VirtualCOM (not USB) ────────────────────
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y

# ── Logging ──────────────────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ── Kernel ───────────────────────────────────────────────────────────────────
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Message queue: 32 slots × 244 bytes = 7 808 bytes
# Defined in source via K_MSGQ_DEFINE
